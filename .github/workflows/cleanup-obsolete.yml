name: Eliminar archivos legados autorizados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete.yml"
      - "scripts/cleanup_obsolete.py"
      - "scripts/obsolete-files.json"
      - "tests/test_cleanup.py"
      - "requirements-validation.txt"
      - "data.js"
      - "Store_Master_Audit.csv"
      - "README.txt"
      - "manifest.json"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - "icon.svg"
      - "style.css"
      - "data/engines/Base_Mix.csv"
  workflow_dispatch:
  workflow_run:
    workflows: ["Validar y publicar Perfil de Tienda"]
    branches: [main]
    types: [completed]

concurrency:
  group: perfil-tienda-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Descargar main vigente
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Instalar validador
        run: python -m pip install --disable-pip-version-check --requirement requirements-validation.txt

      - name: Auditar referencias y retirar sólo legados autorizados
        run: python scripts/cleanup_obsolete.py --apply --check-clean --report "$RUNNER_TEMP/cleanup-report.json"

      - name: Verificar motores, exportaciones y funcionamiento después de limpiar
        run: |
          python scripts/check_file_sizes.py
          python scripts/build_data.py
          python scripts/build_exports.py
          python -m pip check
          python -m unittest discover -s tests -v
          python scripts/stage_site.py --output dist
          python scripts/cleanup_obsolete.py --check-clean

      - name: Mostrar resultado de la limpieza
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cleanup-report.json").read_text())
          lines = ["## Limpieza verificada", f"Archivos retirados: {len(report['removed'])}", f"Fuentes vigentes revisadas: {len(report['checkedSources'])}"]
          lines.extend(f"- `{name}`" for name in report["removed"])
          if not report["removed"]: lines.append("El repositorio ya está libre de los legados autorizados.")
          lines.append("Motores, exportaciones PDF/Excel y pruebas funcionales: correctos.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output: output.write("\n\n".join(lines) + "\n")
          PY

      - name: Registrar únicamente eliminaciones verificadas
        run: |
          python - <<'PY' > "$RUNNER_TEMP/cleanup-deletions.txt"
          import json, os, subprocess
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cleanup-report.json").read_text())
          actual = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=D"], text=True).splitlines()
          if set(actual) != set(report["removed"]): raise SystemExit("La lista de eliminaciones cambió; se cancela el commit.")
          for name in report["removed"]: print(name)
          PY
          mapfile -t obsolete < "$RUNNER_TEMP/cleanup-deletions.txt"
          if [ "${#obsolete[@]}" -eq 0 ] || [ -z "${obsolete[0]}" ]; then
            echo "No hay archivos obsoletos que registrar"
            exit 0
          fi
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$(git rev-parse HEAD)" || {
            echo "main cambió durante la validación. Reejecutar la limpieza."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- "${obsolete[@]}"
          git commit -m "chore: retirar legados después de validar el sitio"
          git push origin HEAD:main
