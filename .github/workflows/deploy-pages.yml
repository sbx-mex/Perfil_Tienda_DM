name: Validar y publicar Perfil de Tienda

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/cleanup-obsolete.yml"
      - "assets/**"
      - "data/engines/**"
      - "data/audit.json"
      - "data/dashboard.json"
      - "data/exports.json"
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - "exports.js"
      - "exports.css"
      - "index.html"
      - "manifest.webmanifest"
      - "operational.css"
      - "requirements-validation.txt"
      - "styles.css"
      - "sw.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: perfil-tienda-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Instalar validador
        run: python -m pip install --disable-pip-version-check --requirement requirements-validation.txt

      - name: Auditar referencias y retirar legados del artefacto
        run: python scripts/cleanup_obsolete.py --apply --check-clean

      - name: Validar límite de archivos
        run: python scripts/check_file_sizes.py

      - name: Auditar motores y construir contrato
        run: python scripts/build_data.py

      - name: Compilar exportaciones por tienda, DM y región
        run: python scripts/build_exports.py

      - name: Ejecutar pruebas funcionales
        run: |
          python -m pip check
          python -m unittest discover -s tests -v

      - name: Preparar sitio mínimo
        run: python scripts/stage_site.py --output dist

      - name: Validar artefacto
        run: |
          test -f dist/index.html
          test -f dist/data/dashboard.json
          test -f dist/data/audit.json
          test -f dist/data/exports.json
          test -f dist/exports.js
          test -f dist/.nojekyll
          test ! -d dist/data/engines

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
