name: Validar y publicar Perfil de Tienda

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/cleanup-obsolete.yml"
      - "assets/**"
      - "data/engines/**"
      - "data/audit.json"
      - "data/dashboard.json"
      - "data/exports.json"
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - "exports.js"
      - "exports.css"
      - "index.html"
      - "manifest.webmanifest"
      - "operational.css"
      - "requirements-validation.txt"
      - "styles.css"
      - "sw.js"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: perfil-tienda-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Instalar validador
        run: python -m pip install --disable-pip-version-check --requirement requirements-validation.txt

      - name: Configurar Node para las pruebas de la aplicación
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validar carga completa con Python
        run: python scripts/validate_project.py --report "$RUNNER_TEMP/validation-report.json"

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Subir artefacto
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
